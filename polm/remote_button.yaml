remote_receiver:
  pin: 
    number: ${ir_receiver}
    inverted: True
  dump: all
  idle: 25ms

remote_transmitter:
  pin: ${ir_transmitter}
  carrier_duty_percent: 50%
  rmt_symbols: 48
  use_dma: True
  non_blocking: True
button:
  - platform: template
    name: "test"
    on_press:
      - if:
          condition: 
            lambda: 'return id(audio_mode) == 0;'
          then:
            - button.press: box_vp
      - if:        
          condition: 
            lambda: 'return id(audio_mode) == 1;'
          then:
            - button.press: tv_vp
  - platform: template
    name: "power"
    id: box_power
    on_press:
      - remote_transmitter.transmit_nec:
          address: 0xFE01
          command: 0xBF40
          command_repeats: 1
  - platform: template
    name: "haut"
    id: box_haut

packages:
  - !include script.yaml
  - !include weather.yaml
  - !include fonts.yaml
api:
  on_client_connected:
    - lvgl.widget.show: lbl_hastatus
    - delay: 2s
    - if:
            condition:
              lambda: !lambda 'return id(rasp_media).state == "playing";'
            then:
              - lvgl.slider.update:
                  id: slider_vol
                  value: !lambda return (id(media_player_volume).state * 100);
            else:
              - if:
                  condition:
                    lambda: !lambda 'return id(tv_media).state == "playing" && id(rasp_media).state == "idle" ;'
                  then:

                    - lvgl.slider.update:
                        id: slider_vol
                        value: !lambda return (id(tv_player_volume).state * 100);
                  else:

                    - lvgl.slider.update:
                        id: slider_vol
                        value: !lambda return (id(media_player_volume).state * 100);
    - if:
              condition:
                lambda: !lambda 'return id(rasp_media).state == "playing";'
              then:
                - lvgl.label.update:
                    id: play_label
                    text: "\U000F03E4"
              
    - if:
                  condition:
                    lambda: !lambda 'return id(rasp_img).state == "${ha_adress}None";'
                  then:
                    #- online_image.set_url:
                        #id: fallback_playing_image
                        #url: https://upload.wikimedia.org/wikipedia/commons/thumb/3/3f/JPEG_example_flower.jpg/330px-JPEG_example_flower.jpg
                    - lvgl.widget.hide: album_art_widget
                    - lvgl.widget.show: album_art_widget2

                  
                  else:
                    - lvgl.widget.show: album_art_widget
                    - lvgl.widget.hide: album_art_widget2
                    - online_image.set_url:
                        id: fallback_playing_image
                        url: !lambda return id(rasp_img).state ; 
    - lvgl.label.update:
                    id: title_label
                    text: !lambda return id(rasp_title).state ;   
    - lvgl.label.update:
                    id: artist_label
                    text: !lambda return id(rasp_artist).state ;  
    - lvgl.label.update:
                    id: album_label
                    text: !lambda return id(rasp_album).state ;     
  on_client_disconnected:
    - if:
        condition:
          lambda: 'return (0 == client_info.find("Home Assistant "));'
        then:
          - lvgl.widget.hide: lbl_hastatus
online_image:
  - url: https://upload.wikimedia.org/wikipedia/commons/thumb/3/3f/JPEG_example_flower.jpg/330px-JPEG_example_flower.jpg
    format: JPEG
    id: fallback_playing_image
    resize: 300x300
    type: RGB565
    on_download_finished:
      - lvgl.image.update:
          id: album_art_widget
          src: fallback_playing_image
image:
  - file: "img/JPEG_example_flower.jpg"
    type: RGB565
    id: flower_image
    resize: 300x300
  - file: "img/wifi_qr.jpg"
    type: RGB565
    id: wifi_qr
    resize: 400x400
text_sensor:
  - platform: homeassistant
    id: rasp_media
    name: "rasp Media State"
    entity_id: ${hifi_salon}
    on_value:
      then:
        - if:
            condition:
              lambda: !lambda 'return x == "playing";'
            then:
              - lvgl.label.update:
                  id: play_label
                  text: "\U000F03E4"
            else:
              - lvgl.label.update:
                  id: play_label
                  text: "\U000F040A"
  - platform: homeassistant
    id: tv_media
    name: "tv Media State"
    entity_id: ${tv_salon2}
    on_value:
      then:
        - if:
            condition:
              lambda: !lambda 'return x == "playing";'
            then:
              - lvgl.label.update:
                  id: play_label
                  text: "\U000F03E4"
            else:
              - lvgl.label.update:
                  id: play_label
                  text: "\U000F040A"
  - platform: homeassistant
    id: rasp_img
    name: "hifi Media img"
    entity_id: ${hifi_salon}
    attribute: entity_picture_local
    filters: 
      - prepend: "${ha_adress}"
    on_value:     
      - if:           
          condition:
                    lambda: !lambda 'return x == "${ha_adress}None";'
          then:
                    #- online_image.set_url:
                        #id: fallback_playing_image
                        #url: https://upload.wikimedia.org/wikipedia/commons/thumb/3/3f/JPEG_example_flower.jpg/330px-JPEG_example_flower.jpg
                    - lvgl.widget.hide: album_art_widget
                    - lvgl.widget.show: album_art_widget2
          else:
                    - lvgl.widget.show: album_art_widget
                    - lvgl.widget.hide: album_art_widget2
                    - online_image.set_url:
                        id: fallback_playing_image
                        url: !lambda return x ;
              
  - platform: homeassistant
    id: rasp_title
    name: "hifi Media title"
    entity_id: ${hifi_salon}
    attribute: media_title
    on_value:
      - if:
            condition:
              lambda: !lambda 'return id(rasp_media).state == "playing";'
            then:
              - lvgl.label.update:
                  id: title_label
                  text: !lambda return x ;
  - platform: homeassistant
    id: tv_title
    name: "tv Media title"
    entity_id: ${tv_salon}
    attribute: media_title
    on_value:
      - if:
            condition:
              lambda: !lambda 'return id(tv_media).state == "playing" && id(rasp_media).state == "idle";'
            then:
              - lvgl.widget.hide: artist_label
              - lvgl.widget.hide: album_label
              - lvgl.label.update:
                  id: title_label
                  text: !lambda return x ;
  - platform: homeassistant
    id: rasp_artist
    name: "hifi Media artist"
    entity_id: ${hifi_salon}
    attribute: media_artist
    on_value:
      - if:
            condition:
              lambda: !lambda 'return id(rasp_media).state == "playing";'
            then:
              - lvgl.widget.show: artist_label
              - lvgl.label.update:
                  id: artist_label
                  text: !lambda return x ;         
  - platform: homeassistant
    id: rasp_album
    name: "hifi Media album"
    entity_id: ${hifi_salon}
    attribute: media_album_name
    on_value:
      - if:
            condition:
              lambda: !lambda 'return id(rasp_media).state == "playing";'
            then:
              - lvgl.widget.show: album_label
              - lvgl.label.update:
                  id: album_label
                  text: !lambda return x ;
switch:
  - platform: lvgl
    widget: wake_label2
    name: wake_switch
    on_turn_on:
      - globals.set:
          id: audio_mode
          value: '1'
      - switch.turn_on: use_wake_word     
    on_turn_off:
      - globals.set:
          id: audio_mode
          value: '0' 
      - switch.turn_off: use_wake_word 
  - platform: template
    id: tv_switch0
    name: tv switch0
    optimistic: true
    restore_mode: RESTORE_DEFAULT_OFF
    on_state:
      - lvgl.widget.update:
          id: tv_switch
          state:
            checked: !lambda return x;
  - platform: template
    id: alarm_switch
    name: alarm switch
    optimistic: true
    restore_mode: RESTORE_DEFAULT_OFF
    on_turn_on:
      - key_collector.enable: lvgl_keypad_collector
      - lvgl.widget.hide: top_layer
      - lvgl.page.show: keypad_page
    on_turn_off:
      - key_collector.disable: lvgl_keypad_collector
      - lvgl.widget.show: top_layer
      - lvgl.page.show: main_page
      - lvgl.led.update:
          id: lvgl_led
          color: 0xFF0000
    
  - platform: template
    id: group_switch
    name: group switch
    optimistic: true
    restore_mode: RESTORE_DEFAULT_OFF
    on_turn_on:
      - lvgl.checkbox.update:
          id: checkbox_group
          state:
            checked: true
      - homeassistant.action:
          action: media_player.volume_set
          data:
              entity_id: ${hifi2_salon}
              volume_level: !lambda return (id(media_player_volume).state );
      

    on_turn_off:
      - lvgl.checkbox.update:
          id: checkbox_group
          state:
            checked: false
  
  - platform: template
    id: party_switch
    name: party switch
    optimistic: true
    restore_mode: RESTORE_DEFAULT_OFF
    on_turn_on:
      - lvgl.widget.update:
          id: party_but
          state:
            checked: true
      - switch.turn_on: group_switch
      - homeassistant.action:
            action: media_player.media_play
            data:
              entity_id: ${hifi_salon}
    on_turn_off:
      - lvgl.widget.update:
          id: party_but
          state:
            checked: false
      - switch.turn_off: group_switch
      - homeassistant.action:
            action: media_player.media_pause
            data:
              entity_id: ${hifi_salon}
binary_sensor:
  - platform: homeassistant
    id: tv_muted
    entity_id: ${tv_salon2}
    attribute: is_volume_muted
    trigger_on_initial_state: true
    on_state:
      - if:
            condition:
              lambda: !lambda 'return id(tv_media).state == "playing";'
            then:
              - lvgl.label.update:
                  id: play_label
                  text: "\U000F03E4"
            else:
              - lvgl.label.update:
                  id: play_label
                  text: "\U000F040A"
sensor:

  - platform: homeassistant
    id: media_player_volume
    entity_id: ${hifi_salon}
    attribute: volume_level
    on_value:
      - if:
            condition:
              lambda: !lambda 'return id(rasp_media).state == "playing";'
            then:

              - lvgl.slider.update:
                  id: slider_vol
                  value: !lambda return (x * 100);
  
  - platform: homeassistant
    id: tv_player_volume
    entity_id: ${tv_salon2}
    attribute: volume_level
    on_value:
      - if:
            condition:
              lambda: !lambda 'return id(tv_media).state == "playing" && id(rasp_media).state == "idle" ;'
            then:

              - lvgl.slider.update:
                  id: slider_vol
                  value: !lambda return (x * 100);
  
  - platform: homeassistant
    id: media_player_dur
    entity_id: ${hifi_salon}
    attribute: media_duration

  - platform: homeassistant
    id: media_player_pos
    entity_id: ${hifi_sensor}   
    on_value:
      - if:
            condition:
              lambda: !lambda 'return id(rasp_media).state == "playing";'
            then:

              - lvgl.bar.update:
                  id: slider_dur
                  value: !lambda return (( id(media_player_dur).state - x)*100)/id(media_player_dur).state;
  - platform: homeassistant
    id: tv_player_dur
    entity_id: ${tv_salon2}
    attribute: media_position
    on_value:
      - if:
            condition:
              lambda: !lambda 'return id(tv_media).state == "playing" && id(rasp_media).state == "idle";'
            then:

              - lvgl.bar.update:
                  id: slider_dur
                  value: !lambda return (x * 100);
globals:
  - id: backlight_brightness_level
    type: float
    restore_value: yes
    initial_value: '0.5'  # 50% default brightness






key_collector:
  
   
  - source_id: lvgl_keypad
    id: lvgl_keypad_collector
    min_length: 4
    max_length: 4
    end_keys: "#"
    end_key_required: true
    back_keys: "*"
    allowed_keys: "0123456789*#"
    timeout: 5s
    on_progress:
      - if:
          condition:
            lambda: return (0 != x.compare(std::string{""}));
          then:
            - lvgl.label.update:
                id: lvgl_label
                text: !lambda 'return x.c_str();'
          else:
            - lvgl.label.update:
                id: lvgl_label
                text: "Enter code and \U000F0E1E"
    on_result:
      - if:
          condition:
            lambda: return (0 == x.compare(std::string{"${pass}"}));
          then:
            - lvgl.led.update:
                id: lvgl_led
                color: 0x00FF00
            - delay: 3s
            - switch.turn_off: alarm_switch
          else:
            - lvgl.led.update:
                id: lvgl_led
                color: 0xFF0000
number:
  - platform: template
    name: LVGL Screen timeout
    optimistic: true
    id: display_timeout
    unit_of_measurement: "s"
    initial_value: 60 
    restore_value: true
    min_value: 20 
    max_value: 180
    step: 10
    mode: box

lvgl:
  rotation: 0
  buffer_size: 100%
  byte_order: little_endian
  displays: main_display
  touchscreens: device_touchscreen
  on_idle:
    timeout: !lambda "return (id(display_timeout).state * 1000);"
    then:
      #- logger.log: "LVGL is idle"
      - light.turn_off: display_backlight
      - lvgl.pause:
  
  
  theme:
    
    label:
      text_font: font1 # set all your labels to use your custom defined font
    button:
      bg_color: 0x2F8CD8
      bg_grad_color: 0x005782
      bg_grad_dir: VER
      bg_opa: COVER
      border_color: 0x0077b3
      border_width: 1
      text_color: 0xFFFFFF
      pressed: # set some button colors to be different in pressed state
        bg_color: 0x006699
        bg_grad_color: 0x00334d
      checked: # set some button colors to be different in checked state
        bg_color: 0x1d5f96
        bg_grad_color: 0x03324A
        text_color: 0xfff300
    buttonmatrix:
      bg_opa: TRANSP
      border_color: 0xFFFFFF
      border_width: 0
      text_color: 0xFFFFFF
      pad_all: 0
      items: # set all your buttonmatrix buttons to use your custom defined styles and font
        bg_color: 0x2F8CD8
        bg_grad_color: 0x005782
        bg_grad_dir: VER
        bg_opa: COVER
        border_color: 0x0077b3
        border_width: 0
        text_color: 0xFFFFFF
        text_font: font2
        pressed:
          bg_color: 0x006699
          bg_grad_color: 0x00334d
        checked:
          bg_color: 0x1d5f96
          bg_grad_color: 0x03324A
          text_color: 0xffff00
    switch:
      bg_color: 0xC0C0C0
      bg_grad_color: 0xb0b0b0
      bg_grad_dir: VER
      bg_opa: COVER
      checked:
        bg_color: 0x1d5f96
        bg_grad_color: 0x03324A
        bg_grad_dir: VER
        bg_opa: COVER
      knob:
        bg_color: 0xFFFFFF
        bg_grad_color: 0xC0C0C0
        bg_grad_dir: VER
        bg_opa: COVER
    slider:
      border_width: 1
      border_opa: 15%
      bg_color: 0xcccaca
      bg_opa: 15%
      indicator:
        bg_color: 0x1d5f96
        bg_grad_color: 0x03324A
        bg_grad_dir: VER
        bg_opa: COVER
      knob:
        bg_color: 0x2F8CD8
        bg_grad_color: 0x005782
        bg_grad_dir: VER
        bg_opa: COVER
        border_color: 0x0077b3
        border_width: 1
        text_color: 0xFFFFFF
  style_definitions:
    - id: header_footer
      
      bg_color: 0x2F8CD8
      bg_grad_color: 0x005782
      bg_grad_dir: VER
      bg_opa: COVER
      border_opa: TRANSP
      radius: 0
      pad_all: 0
      pad_row: 0
      pad_column: 0
      border_color: 0x0077b3
      text_color: 0xFFFFFF
      width: 100%
      height: 50
    - id: but_style
      bg_color: 0x2F8CD8
      bg_grad_color: 0x005782
      bg_grad_dir: VER
      bg_opa: COVER
      border_color: 0x0077b3
      border_width: 1
      text_color: 0xFFFFFF
      text_font: font2
    - id: date_style
      text_font: unscii_8
      align: center
      text_color: 0x000000
      bg_opa: 60%
      radius: 4
      pad_all: 2
    - id: glob_style
      bg_color: 0xFFFFFF
      text_color: 0x005782
      
      
  
  top_layer:     
    widgets:
      - label:
          text: "\U000F05A9"
          id: lbl_hastatus
          hidden: true
          align: top_right
          x: -2
          y: 7
          text_align: right
          text_color: 0xFFFFFF
      - obj:
            align: CENTER
            id: assist_obj
            hidden: true
            height: 200
            width: 200
            bg_opa: 0.5
            #styles: header_footer
            widgets:
              - label:
                  id: assist_label
                  text: "\U000F171A"
                  text_font: font3
                  text_align: CENTER
                  align: CENTER
                  text_color: 0x3827F5
                  bg_color: 0x808080
      - buttonmatrix:
          align: bottom_mid
          hidden: false
          styles: header_footer
          pad_all: 0
          outline_width: 0
          id: top_layer
          text_font: font1
          items:
            styles: header_footer
          rows:
            - buttons:
              - id: page_remote
                text: "\U000F0454"
                
                on_click:
                  then:
                    lvgl.page.show: main_page
              - id: page_assist
                text: "\U000F171A"
                on_pressing:
                  - if:
                      condition:
                        lambda: 'return id(audio_mode) == 1;'
                      then:
                        - switch.turn_off: use_wake_word
                  - delay: 0.5s
                  - voice_assistant.start:
                      silence_detection: false
              
                on_release:
                  - voice_assistant.stop:
                  - delay: 0.5s
                  - if:
                      condition:
                        lambda: 'return id(audio_mode) == 1;'
                      then:

                        - switch.turn_on: use_wake_word
              - id: page_home
                text: "\U000F07D1"
                on_click:
                  then:
                    lvgl.page.show: home_page
      - keyboard:
          id: keyboard_id
          hidden: true
          textarea: textarea_search_music
          mode: TEXT_LOWER
          height: 270
      
      - obj:
            hidden: true
            id: search_window
            y: 30
            x: 10
            #align: CENTER
            height: 300
            width: 460
            bg_opa: 0.7
            pad_all: 0
            border_width: 2
            border_color: black
            bg_color: 0x4055B3
            widgets:
              - label:
                  text: "search:"
                  align: TOP_MID
                  text_align: CENTER
                  text_color: 0xFFFFFF
              - button:
                  id: search_close
                  align: TOP_RIGHT
                  radius: 50
                  width: 50
                  height: 50
                  bg_color: 0xE60505
                  on_click:
                    then:
                      
                      - lvgl.textarea.update:
                              id: textarea_search_music
                              text: ""
                      - lvgl.widget.hide: keyboard_id
                      - lvgl.widget.hide: search_window
                      - if:
                          condition:
                            lvgl.page.is_showing: player_page
                          then:
                            - lvgl.widget.hide: music_option

                      
                  widgets:
                    - label:
                        text: "\U000F015A"
                        text_font: font2
                        align: CENTER
                        text_align: CENTER
                        text_color: 0xFFFFFF
              - textarea:
                  id: textarea_search_music
                  #align: CENTER
                  y: 70
                  x: 30
                  width: 400
                  height: 70
                  one_line: true
                  bg_opa: 1
                  text_font: font2
                  text_align: CENTER
                  text_color: 0x000000
                  bg_color: 0xFFFFFF
                  placeholder_text: "Enter text here"
                  on_focus:
                    - lvgl.widget.show: keyboard_id
                   
                  on_ready:
                    - if:
                        condition:
                          lvgl.page.is_showing: player_page
                        then:
                          - if:
                              condition:
                                lambda: !lambda 'return id(switch_artist).state == true;'
                              then:
                                - mqtt.publish:
                                    topic: search/artist
                                    payload: !lambda 'return text;'
                          - if:
                              condition:
                                lambda: !lambda 'return id(switch_album).state == true;'
                              then:
                                - mqtt.publish:
                                    topic: search/album
                                    payload: !lambda 'return text;'
                          - if:
                              condition:
                                lambda: !lambda 'return id(switch_track).state == true;'
                              then:
                                - mqtt.publish:
                                    topic: search/track
                                    payload: !lambda 'return text;'

                          
                          #- mqtt.publish:
                              #topic: search/artist
                              #payload: !lambda 'return text;'
                          - delay: 0.5s
                          - lvgl.textarea.update:
                              id: textarea_search_music
                              text: ""
              - obj:
                  hidden: true
                  id: music_option
                  y: 160
                  x: 20
                  #align: CENTER
                  height: 100
                  width: 420
                  bg_opa: 0
                  pad_all: 0
                  border_width: 2
                  border_color: red
                  bg_color: 0x4055B3
                  widgets:
                    - label:
                        text: "artist"
                        align: TOP_LEFT
                        text_align: CENTER
                        text_color: 0xFFFFFF
                    - checkbox:
                        align: BOTTOM_LEFT
                        id: checkbox_artist
                        text_font: montserrat_32
                    - label:
                        text: "album"
                        align: TOP_MID
                        text_align: CENTER
                        text_color: 0xFFFFFF
                    - checkbox:
                        align: BOTTOM_MID
                        id: checkbox_album
                        text_font: montserrat_32
                    - label:
                        text: "track"
                        align: TOP_RIGHT
                        text_align: CENTER
                        text_color: 0xFFFFFF
                    - checkbox:
                        align: BOTTOM_RIGHT
                        id: checkbox_track
                        text_font: montserrat_32

      - image:
            id: qr_wifi_widget
            hidden: true
            align: CENTER
            src: wifi_qr
            width: 400
            height: 400
            antialias: false
            clickable: true
            on_click:
              - lvgl.widget.hide: qr_wifi_widget
      
  pages:
    - id: main_page
      on_swipe_left:
        then:
          - lvgl.page.show: player_page
      widgets:
        - obj:
            align: TOP_MID
            styles: header_footer
            widgets:
              - label:
                  text: ";polm remote"
                  align: CENTER
                  text_align: CENTER
                  text_color: 0xFFFFFF
        - button:
            id: pow_but
            x: 1
            y: 50
            radius: 100
            width: 100
            height: 100
            bg_color: 0xE60505
            widgets:
              - label:
                  text: "\U000F0425"
                  text_font: font2
                  text_align: CENTER
                  align: CENTER
                  text_color: 0xFFFFFF
            on_click:
              then:
                - button.press: box_power
          
        - label:
              id: rm_label
              x: 200
              y: 50
              #align: CENTER
              width: 100
              height: 50
              text: "box"
              #text_align: CENTER
              text_font: font2
              text_color: 0x000000
        - switch:
            id: tv_switch
            x: 370
            y: 50
            width: 100
            height: 50
            
            state:
              checked: false
            #bg_color: 0x4B5563
            on_change:
              then:
                #- logger.log:
                    #format: "Switch state: %d"
                    #args: [ x ]
                - if:
                    condition:
                      - lambda: !lambda 'return x == 1;'
                    then:
                      - lvgl.label.update:
                          id: rm_label
                          text: "tv"
                      - switch.turn_on: tv_switch0

                - if:
                    condition:
                      - lambda: !lambda 'return x == 0;'
                    then:
                      - switch.turn_off: tv_switch0
                      - lvgl.label.update:
                          id: rm_label
                          text: "box"
        - buttonmatrix:
            id: rm_keypad
            x: 25
            y: 160
            width: 420
            height: 420
            text_font: font2
            items:
              pressed:
                bg_color: 0xFFFF00
            rows:
              - buttons:
                #text_font: font2
                  - text: "av"
                    control:
                      no_repeat: true
                    on_press:
